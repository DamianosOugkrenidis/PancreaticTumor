run:
  seed: 42
  device: auto
  require_cuda: false
  deterministic: true
  output_dir: outputs/runs
  run_name: ~

data:
  root: datasets/prepared
  dataset_json: dataset.json
  valid_ratio: 0.2
  roi_size: [96, 96, 96]
  pixdim: [1.5, 1.5, 1.5]
  hu_window: [-175, 250]
  intensity_range: [0.0, 1.0]
  num_samples: 4
  batch_size: 2
  num_workers: 4
  cache_rate: 0.5
  augment: true
  labels: {background: 0, pancreas: 1, tumor: 2}

train:
  epochs: 200
  amp: true
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 10
  scheduler: cosine
  eta_min: 1.0e-6
  log_every_steps: 20
  val_interval: 1
  max_steps: 0
  save_every_epochs: 0
  early_stopping:
    enabled: true
    patience: 40
    min_delta: 0.001
    mode: max
  loss:
    name: dice_ce
    dice_weight: 1.0
    ce_weight: 1.0
    class_weights: ~
    include_background: false

eval:
  sw_batch_size: 4
  overlap: 0.5
  mode: gaussian
  include_background: false
  hd95_percentile: 95.0
  nsd_tolerance_mm: 1.0
  metrics: [dice, iou, precision, recall, hd95, nsd]
  selection_metric: tumor_dice
  max_cases: 0
