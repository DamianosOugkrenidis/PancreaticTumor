extends: base.yml

model:
  name: unetr
  in_channels: 1
  out_channels: 3
  img_size: [96, 96, 96]
  patch_size: 16
  feature_size: 16
  hidden_size: 768
  mlp_dim: 3072
  num_heads: 12
  num_layers: 12
  proj_type: conv
  pos_embed: learnable
  qkv_bias: true
  dropout: 0.0
  attn_dropout: 0.0
